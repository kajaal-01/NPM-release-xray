name: Build, Scan, Bundle and Distribute (npm)
on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JF_URL: https://cloudmigration.jfrog.io
      NPM_VIRTUAL_REPO: payments-dev-npm        # virtual repo (resolve)
      NPM_LOCAL_REPO: payments-dev-npm-local     # local repo (deploy)
      BUILD_NAME: my-npm-build
      BUILD_NUMBER: ${{ github.run_number }}
      RB_NAME: my-npm-release-bundle
      RB_VERSION: 1.0.${{ github.run_number }}
      # Lets every jf command pick up build name/number automatically
      JFROG_CLI_BUILD_NAME: my-npm-build
      JFROG_CLI_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JFrog CLI via OIDC
        uses: jfrog/setup-jfrog-cli@v4
        with:
          oidc-provider-name: github-oidc-provider-test
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure npm repositories
        run: |
          jf npm-config \
            --repo-resolve=$NPM_VIRTUAL_REPO \
            --repo-deploy=$NPM_LOCAL_REPO

      - name: Install dependencies and build
        run: |
          jf npm install
          npm run build --if-present
          npm test --if-present

      - name: Publish package to Artifactory
        run: jf npm publish

      - name: Publish Build Info
        run: |
          jf rt bp $BUILD_NAME $BUILD_NUMBER \
            --collect-git-info \
            --collect-env

      - name: Scan build with Xray
        run: |
          # Fails the job (exit code 3) if a policy with "fail build" is violated
          jf build-scan $BUILD_NAME $BUILD_NUMBER

      - name: Create release bundle from build
        run: |
          cat > rb-spec.json <<EOF
          {
            "builds": [
              { "name": "$BUILD_NAME", "number": "$BUILD_NUMBER" }
            ]
          }
          EOF

          jf release-bundle-create $RB_NAME $RB_VERSION \
            --builds=rb-spec.json \
            --signing-key=${{ secrets.RB_SIGNING_KEY_ALIAS }} \
            --sync

      - name: Distribute release bundle to Edge node
        run: |
          cat > dist-rules.json <<EOF
          {
            "distribution_rules": [
              { "site_name": "edgeimplementation" }
            ]
          }
          EOF

          jf release-bundle-distribute $RB_NAME $RB_VERSION \
            --dist-rules=dist-rules.json \
            --create-repo \
            --sync
